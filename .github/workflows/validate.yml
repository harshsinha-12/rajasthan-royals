name: Validate final submission artifacts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: python src/verify_public.py
      - run: node --check website/app.js
      - run: python src/build_website.py
      - run: python src/verify_website.py
